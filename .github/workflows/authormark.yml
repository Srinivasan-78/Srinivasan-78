name: authormark
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify authorship watermarks are intact
        # Presence check here; full fingerprint verification runs in the
        # provenance workflow's verify-authorship job on push to main.
        uses: Srinivasan-78/authormark-watch@f9f195010310321387128245b5ae4d494e0740de  # main
